name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Stdlib only: nothing to install. pypdf is optional for one script
      # and must never be required here.
      - name: Render tests
        run: python3 scripts/test-render.py

      - name: HTML-to-Markdown tests
        run: python3 scripts/test-html-to-md.py

      - name: ATS check tests
        run: python3 scripts/test-ats-check.py

      - name: Link and layering check
        run: python3 scripts/check-links.py
